# ── Paths ──────────────────────────────────────────────────────────────────────
pipeline:
  data_dir:       "./datas"
  results_dir:    "./results"
  species_target: "Human" 

# ── Sample table (TSV: folder_id, protocol, comparison_group[, quant_format]) ──
  sample_table: "./sample_table.tsv"

  # false (default): samples sharing a comparison_group are merged, integrated
  #                  (Harmony) and clustered together.
  # true : every row of the sample table is analysed fully on its own (own
  #        clustering, UMAP, SingleR, subsets, output folder results_dir/<folder_id>/).
  #        No between-sample comparison is possible in this mode.
  independent_samples: false

# ── Input data ─────────────────────────────────────────────────────────────────
# format: how each sample folder under data_dir is read. "auto" inspects the
# folder; override globally here, or per-sample via an optional quant_format
# column in sample_table.tsv (blank cell = use the setting below).
#   auto      - inspect the folder and pick one of the formats below
#   alevin    - salmon alevin       (<folder>/alevin/quants_mat.gz)
#   10x       - Cell Ranger MEX     (<folder>/outs/filtered_feature_bc_matrix/)
#   10x_h5    - Cell Ranger HDF5    (<folder>/outs/*.h5, or a bare *.h5 file)
#   starsolo  - STARsolo            (<folder>/Solo.out/<starsolo_feature>/{filtered,raw}/)
#   h5ad      - AnnData             (a *.h5ad file directly under <folder>/)
#   mtx       - generic MatrixMarket triplet (matrix.mtx/barcodes.tsv/features.tsv)
input:
  format:             "auto"
  starsolo_feature:   "Gene"    # Gene | GeneFull | Velocyto
  h5ad_raw_slot:      "auto"    # auto | layers:counts | raw | X
  save_raw_matrix:    true
  raw_matrix_format:  "mtx"     # mtx | h5 -> results_dir/<comparison_group>/RawMatrix/<folder_id>/

# ── Species config ─────────────────────────────────────────────────────────────
# ref_primary / ref_secondary: name of a celldex function (no parentheses)
# Supported: ImmGenData, MouseRNAseqData, HumanPrimaryCellAtlasData,
#            BlueprintEncodeData, DatabaseImmuneCellExpressionData,
#            NovershternHematopoieticData, MonacoImmuneData
species:
  gene_removal_pattern: "^RPS|^RPL|^HBA[12]?|^HBB$"
  mt_pattern:           "^MT-"     
  genes_to_remove: ""
  ref_primary:   "HumanPrimaryCellAtlasData"
  ref_secondary: "BlueprintEncodeData"

sex_scoring:
  run: true
  regress: true
  markers:
    female: ["XIST", "TSIX"]
    male: ["DDX3Y", "PRKY", "KDM5D", "RPS4Y1", "UTY", "USP9Y"]

cell_cycle:
  run: true
  regress: true

# ── QC filters ─────────────────────────────────────────────────────────────────
qc:
  min_features:   200
  max_counts:     30000
  max_mt_percent: 10
  min_cells:      3  

# ── Seurat processing ──────────────────────────────────────────────────────────
processing:
  vars_to_regress: ["percent.mt"]
  pca_dims_from:      1
  pca_dims_to:        21
  cluster_resolution: 0.5
  n_elbow_dims:       50
  cluster_col:        "seurat_clusters"
  condition_col:      "condition"
  reduction:          "umap"

# ── DEG ────────────────────────────────────────────────────────────────────────
deg:
  # false -> no between-condition comparison: no DEG tables / DEG-count UMAP,
  # no chi-squared, no scProportionTest. Samples stay merged and share clusters.
  # Cluster markers, annotation and descriptive plots are still produced.
  run:                 true
  logfc_threshold:     0.25
  min_pct:             0.1
  min_cells_per_group: 10
  min_p_val_adj:       0.01
  min_deg_display:     10

# ── SingleR ────────────────────────────────────────────────────────────────────
singler:
  labels:
    - name:      "singleR_labels_main"
      ref_field: "label.main"
      is_fine:   false
    - name:      "singleR_labels_fine"
      ref_field: "label.fine"
      is_fine:   true
  min_cells_per_group: 10

# ── Cell labeling ──────────────────────────────────────────────────────────────
labeling:
  marker_positive_threshold: 0.1
  min_subset_cells:          20

# ── Plot dimensions ────────────────────────────────────────────────────────────
plot:
  umap_width_standard:  14
  umap_height_standard: 7
  umap_width_fine:      16
  umap_height_fine:     14

# ── Escape Pathway Enrichment ──────────────────────────────────────────────────
escape:
  run:      true
  method:   "AUCell"   # Options: "ssGSEA", "UCell", "AUCell", "GSVA" # WARNING ssGSEA is demanding
  library:  "H"        # "H" = Hallmark, "C5" = Gene Ontology, etc.
  min_size: 5

