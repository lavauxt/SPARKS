# RANK dataset overrides for inst/config_template_mouse.yaml
pipeline:
  data_dir: "./data/RANK"
  results_dir: "./results_RANK"
  sample_table: "./data/RANK/sample_table.tsv"

sex_scoring:
  run: false
  regress: false

cell_cycle:
  run: false
  regress: false

# RANK does not have a usable replicate design for ranked pseudobulk GSEA.
# Per-cell pathway scores are descriptive and do not require biological
# replicates; they are not tests of WT-vs-KO differences.
gsea:
  run: false

escape:
  run: true
  methods: ["UCell", "AUCell"]
  library: "H"
  min_size: 5

genes:
  genes_to_plot:
    - "Sphk1"
    - "Spns2"
    - "S1pr1"
    - "S1pr2"
    - "S1pr3"
    - "S1pr4"
    - "S1pr5"
    - "Cd19"
    - "Cd3e"
    - "Cd4"
    - "Cd8a"
    - "Cd68"
    - "Flt3"
    - "Foxp3"
    - "Itga2b"
    - "Ackr4"
    - "Ccr6"
    - "Cdh5"
    - "Lyve1"
    - "Mpz"
    - "Pdgfra"
    - "Pdgfrb"
    - "Pdpn"
    - "Dcn"
    - "Mki67"
    - "Ptprc"
    - "Pecam1"
    - "Prox1"
    - "Ccl19"
    - "Tnfsf11"
    - "Cxcl13"
    - "Madcam1"
    - "Vcam1"
    - "Cr2"
    - "Mfge8"
  corr_genes_x:
    - "S1pr1"
    - "S1pr2"
    - "S1pr3"
    - "S1pr4"
    - "S1pr5"
  corr_genes_y:
    - "Ccl19"
    - "Cxcl13"
    - "Mfge8"
    - "Cr2"

gene_signatures:
  - name: "Vascular_Tightness & Lipid_Scavenger"
    dot_scale: true
    genes:
      - "Cdh5"
      - "Cldn5"
      - "Tjp1"
      - "Pdgfa"
      - "Pdgfb"
      - "Cd36"
      - "Ackr3"
      - "Ackr4"
      - "Stab1"
      - "Cav1"
      - "Cav2"
      - "Plpp3"

subsets:
  - display_name: "Cluster_7"
    match_col: "seurat_clusters"
    pattern:
      - "^7$"
    exact_match: false
    type_col: "cluster_7_subtype"
    pca_dims_from: 1
    pca_dims_to: 10
    deg_color: "purple"
    genes:
      - "Pecam1"
      - "Cdh5"
      - "Prox1"
      - "Lyve1"
      - "Pdpn"
      - "Ccl19"
      - "Cxcl13"
      - "Madcam1"
      - "Vcam1"
      - "Tnfsf11"
    label_rules: []

  - display_name: "Fibroblasts"
    match_col: "singleR_labels_main"
    pattern:
      - "Fibroblasts"
    exact_match: true
    type_col: "fibroblast_type"
    pca_dims_from: 1
    pca_dims_to: 10
    color: "darkgreen"
    genes:
      - "Ccl19"
      - "Cxcl13"
      - "Madcam1"
      - "Vcam1"
      - "Tnfsf11"
    label_rules: []

  - display_name: "Endothelial"
    match_col: "singleR_labels_main"
    pattern:
      - "Endothelial cells"
    exact_match: true
    type_col: "endothelial_type"
    pca_dims_from: 1
    pca_dims_to: 10
    color: "orange"
    genes:
      - "Lyve1"
      - "Madcam1"
      - "Itga2b"
      - "Glycam1"
      - "Cd44"
      - "Pf4"
      - "Vcam1"
      - "Ackr4"
      - "Cd36"
      - "Fabp4"
      - "Ccl21a"
      - "Ackr3"
    label_rules: []
